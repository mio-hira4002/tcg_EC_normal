<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>カート｜TCG GATE JAPAN</title>
<meta name="description" content="カートの中身と送料無料までの金額。">
<meta property="og:title" content="カート｜TCG GATE JAPAN">
<meta property="og:description" content="カートの中身と送料無料までの金額。">
<meta property="og:type" content="website">
<meta name="theme-color" content="#1B2140">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='5' width='15' height='21' rx='3' fill='%23fff' stroke='%230E0E10' stroke-width='2' transform='rotate(-10 11 15)'/%3E%3Crect x='13' y='6' width='15' height='21' rx='3' fill='%230E0E10' transform='rotate(9 20 16)'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="" data-theme="normal">

<main id="main"><div class="wrap"><nav class="crumb" aria-label="パンくず"><a href="index.html" data-en="Home">トップ</a><span>／</span><span data-en="Cart">カート</span></nav>
<header class="page-hd"><p class="eyebrow">Cart</p><h1 class="display d-l" data-en="Your cart">カート</h1></header>
<div id="cartwrap"></div></div></main>
<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script>

(function(){function render(){var U=window.TCGUI,en=U.lang()==="en",c=U.cart();
 if(!c.length){U.$("#cartwrap").innerHTML='<div class="empty"><p class="display d-m">'+(en?"Your cart is empty.":"カートは空です。")+'</p><a class="btn" href="buy.html" style="margin-top:22px">'+(en?"Browse singles":"シングルを見る")+'</a></div>';return;}
 var sub=U.subtotal();
 U.$("#cartwrap").innerHTML='<div class="cart-grid"><div>'+U.itemsHTML(true)+'<a class="link" href="buy.html" style="display:inline-block;margin-top:22px;font-weight:700">'+(en?"← Keep shopping":"← 買い物を続ける")+'</a></div>'+
 '<aside class="summary" id="checkout"><h2 style="margin:0 0 6px;font-size:18px">'+(en?"Order summary":"ご注文内容")+'</h2>'+U.shipHTML()+
 '<div class="line"><span>'+(en?"Subtotal":"小計")+'</span><span class="num">'+U.yen(sub)+'</span></div><div class="line"><span>'+(en?"Shipping":"送料")+'</span><span>'+(en?"Calculated at checkout":"購入手続きで計算 [要確認]")+'</span></div>'+
 '<div class="line" style="border-top:1px solid var(--ink);margin-top:10px;padding-top:16px;align-items:baseline"><span>'+(en?"Total":"合計")+'</span><span class="total">'+U.yen(sub)+'</span></div>'+
 '<button type="button" class="btn block" id="co" style="margin-top:16px">'+(en?"Checkout":"レジに進む")+'</button><p class="muted" style="font-size:12px;margin:12px 0 0">'+(en?"Payment and shipping are handled on the Shopify checkout.":"決済・配送方法はShopifyのチェックアウト画面で選択します（本番で接続）。")+'</p></aside></div>';
 U.$("#co").onclick=function(){U.toast(en?"Connects to Shopify checkout in production":"本番ではShopifyのチェックアウトへ移動します");};}
 document.addEventListener("tcg:ready",render);document.addEventListener("tcg:cart",function(){if(window.TCGUI&&document.readyState!=="loading")render();});document.addEventListener("tcg:lang",function(){if(window.TCGUI&&document.readyState!=="loading")render();});})();

</script>
</body>
</html>
