<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>シングル販売｜TCG GATE JAPAN</title>
<meta name="description" content="ポケモンカードのシングル・PSA鑑定品・旧裏・未開封BOX。状態ランク付きで販売しています。">
<meta property="og:title" content="シングル販売｜TCG GATE JAPAN">
<meta property="og:description" content="ポケモンカードのシングル・PSA鑑定品・旧裏・未開封BOX。状態ランク付きで販売しています。">
<meta property="og:type" content="website">
<meta name="theme-color" content="#1B2140">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='5' width='15' height='21' rx='3' fill='%23fff' stroke='%230E0E10' stroke-width='2' transform='rotate(-10 11 15)'/%3E%3Crect x='13' y='6' width='15' height='21' rx='3' fill='%230E0E10' transform='rotate(9 20 16)'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="buy" data-theme="normal">

<main id="main">
<div class="wrap">
<nav class="crumb" aria-label="パンくず"><a href="index.html" data-en="Home">トップ</a><span>／</span><span data-en="Buy">買いたい</span><span id="crumb-x"></span></nav>
<header class="page-hd" style="border-bottom:0;padding-bottom:20px">
<p class="eyebrow">All items</p>
<h1 class="display d-l"><span class="rise"><span id="ttl">シングル販売</span></span></h1>
<p class="muted" style="margin:14px 0 0" id="count"></p>
</header>
</div>
<div class="toolbar" id="cats">
<div class="wrap" style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:14px;width:100%">
<div class="chips" id="catchips" role="group" aria-label="カテゴリー"></div>
<div style="display:flex;flex-wrap:wrap;align-items:center;gap:14px">
<label class="check"><input type="checkbox" id="instock"><span data-en="In stock only">在庫ありのみ</span></label>
<label class="sr" for="sort">並び替え</label>
<select class="select" id="sort"><option value="new" data-en="Newest">新着順</option><option value="low" data-en="Price: low to high">価格の安い順</option><option value="high" data-en="Price: high to low">価格の高い順</option></select>
</div>
</div>
</div>
<div class="wrap">
<div class="chips" id="setchips" role="group" aria-label="シリーズ" style="padding:18px 0 0"></div>
<div class="grid" id="grid" style="padding:40px 0 100px"></div>
</div>
</main>

<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script>

(function(){
  var st={cat:null,set:null,q:null,instock:false,sort:"new"};
  function init(){var U=window.TCGUI;st.cat=U.param("cat");st.set=U.param("set");st.q=U.param("q");
    U.$("#instock").addEventListener("change",function(e){st.instock=e.target.checked;render();});
    U.$("#sort").addEventListener("change",function(e){st.sort=e.target.value;render();});
    document.addEventListener("click",function(e){var c=e.target.closest("[data-cat]");if(c){st.cat=c.getAttribute("data-cat")||null;st.set=null;st.q=null;sync();render();}
      var s=e.target.closest("[data-set]");if(s){st.set=s.getAttribute("data-set")||null;st.q=null;sync();render();}});
    render();}
  function sync(){var u=new URLSearchParams();if(st.cat)u.set("cat",st.cat);if(st.set)u.set("set",st.set);if(st.q)u.set("q",st.q);try{history.replaceState(null,"",location.pathname+(u.toString()?"?"+u:""));}catch(e){}}
  function render(){var U=window.TCGUI,D=window.TCG,en=U.lang()==="en";
    var cat=D.cats.filter(function(c){return c.id===st.cat;})[0], set=D.sets.filter(function(s){return s.code===st.set;})[0];
    var list=D.products.filter(function(p){
      if(st.cat&&p.cat!==st.cat)return false; if(st.set&&p.set!==st.set)return false;
      if(st.q){var q=st.q.toLowerCase();if((p.name+p.en+p.num+p.set+p.rarity).toLowerCase().indexOf(q)<0)return false;}
      if(st.instock&&p.stock<=0)return false; return true;});
    if(st.sort==="low")list.sort(function(a,b){return a.price-b.price;}); if(st.sort==="high")list.sort(function(a,b){return b.price-a.price;});
    var title=st.q?("“"+st.q+"”"):cat?(en?cat.en:cat.name):set?("["+set.code+"] "+(en?set.en:set.name)):(en?"All singles":"シングル販売");
    U.$("#ttl").textContent=title; document.title=title+"｜TCG GATE JAPAN";
    U.$("#crumb-x").innerHTML=(cat||set||st.q)?'<span style="margin:0 8px">／</span>'+U.esc(title):"";
    U.$("#count").textContent=list.length+(en?" items":" 件");
    U.$("#catchips").innerHTML='<button type="button" class="chip'+(!st.cat?" on":"")+'" data-cat="">'+(en?"All":"すべて")+'</button>'+D.cats.map(function(c){var n=D.products.filter(function(p){return p.cat===c.id;}).length;return '<button type="button" class="chip'+(st.cat===c.id?" on":"")+'" data-cat="'+c.id+'" aria-pressed="'+(st.cat===c.id)+'">'+(en?c.en:c.name)+' <span class="n">'+n+'</span></button>';}).join("");
    U.$("#setchips").innerHTML='<span class="eyebrow" style="align-self:center;margin-right:8px">Sets</span>'+D.sets.map(function(s){return '<button type="button" class="chip'+(st.set===s.code?" on":"")+'" data-set="'+(st.set===s.code?"":s.code)+'" style="height:36px;font-size:13px"><span class="en" style="font-weight:900">'+s.code+'</span>'+(en?s.en:s.name)+'</button>';}).join("");
    U.$("#grid").innerHTML=list.length?list.map(U.card).join(""):'<div class="empty" style="grid-column:1/-1"><p class="display d-m">'+(en?"Nothing here yet.":"現在、該当する商品はありません。")+'</p><p class="muted">'+(en?"New stock arrives every week.":"入荷は毎週あります。他のカテゴリーもご覧ください。")+'</p><a class="btn" href="buy.html" style="margin-top:20px">'+(en?"All singles":"すべての商品を見る")+'</a></div>';
  }
  document.addEventListener("tcg:ready",init);
  document.addEventListener("tcg:lang",function(){if(window.TCGUI&&document.readyState!=="loading")render();});
})();

</script>
</body>
</html>
